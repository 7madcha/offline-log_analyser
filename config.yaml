required_columns:
  - timestamp
  - src_ip
  - dst_ip
  - src_port
  - dst_port
  - protocol
  - action
  - bytes_sent
  - bytes_received

brute_force:
  blocked_attempts: 50
  window_minutes: 1
  destination_ports:
    - 22
    - 23
    - 3389
  score: 30

port_scan:
  unique_ports: 20
  window_minutes: 5
  score: 25

host_scan:
  unique_destinations: 30
  window_minutes: 5
  score: 20

large_transfer:
  percentile: 0.99
  minimum_bytes: 10000000
  score: 20

off_hours:
  start_hour: 0
  end_hour: 5
  score: 10

correlation:
  window_minutes: 15
  multiple_alert_bonus: 15

severity:
  low_max: 29
  medium_max: 59
  high_max: 79
  critical_max: 100

# Local Isolation Forest settings. No data leaves this computer.
ai_detection:
  enabled: true
  window_minutes: 5
  n_estimators: 200
  contamination: 0.02
  random_state: 42
  anomaly_threshold: 60

analytics:
  top_n: 10

# Used when creating the AI off-hours behavioral feature.
working_hours:
  start_hour: 5
  end_hour: 24
