required_columns:
  - timestamp
  - src_ip
  - dst_ip
  - src_port
  - dst_port
  - protocol
  - action
  - bytes_sent
  - bytes_received

schema_mapping:
  aliases:
    timestamp: [event_time, time, date, datetime, log_time, generated time, receive time, high resolution timestamp]
    src_ip: [source_ip, source_address, source address, client_ip, src]
    dst_ip: [destination_ip, destination_address, destination address, server_ip, dst]
    src_port: [source_port, source port, client_port, sport]
    dst_port: [destination_port, destination port, server_port, dport, port]
    protocol: [transport_protocol, transport, proto]
    action: [verdict, decision, disposition, result, status]
    bytes_sent: [bytes sent, bytes_out, outbound_bytes, sent_bytes, out_bytes]
    bytes_received: [bytes received, bytes_in, inbound_bytes, received_bytes, in_bytes]

brute_force:
  blocked_attempts: 50
  window_minutes: 1
  destination_ports:
    - 22
    - 23
    - 3389
  score: 30

port_scan:
  unique_ports: 20
  window_minutes: 5
  score: 25

host_scan:
  unique_destinations: 30
  window_minutes: 5
  score: 20

large_transfer:
  percentile: 0.99
  minimum_bytes: 10000000
  score: 20

off_hours:
  start_hour: 0
  end_hour: 5
  score: 10

correlation:
  window_minutes: 15
  multiple_alert_bonus: 15

severity:
  low_max: 29
  medium_max: 59
  high_max: 79
  critical_max: 100

# Local Isolation Forest settings. No data leaves this computer.
ai_detection:
  enabled: true
  window_minutes: 5
  n_estimators: 200
  contamination: 0.02
  random_state: 42
  anomaly_threshold: 60

analytics:
  top_n: 10

# Used when creating the AI off-hours behavioral feature.
working_hours:
  start_hour: 5
  end_hour: 24

# Per-asset / per-subnet baselining. When disabled, all detectors use the
# global fixed thresholds above, reproducing the original behavior exactly.
baselining:
  enabled: false
  group_by: src_ip          # src_ip | subnet24 (uses subnet_prefix_length)
  subnet_prefix_length: 24  # CIDR prefix length when group_by is subnet24
  min_history_events: 20    # minimum events before per-asset baseline is trusted
  deviation_multiplier: 2.0 # effective_threshold = baseline_median * multiplier
  min_threshold_floor: 5    # absolute minimum threshold (prevents collapse to near-zero)
